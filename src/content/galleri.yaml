# Galleriet på mawini.com – en post per bild eller bildpar.
# Ordningen här = ordningen i galleriet (flytta poster för att ändra).
#
# file      filnamn i src/assets/gallery/<category>/
# category  graphic-design, photography, illustration eller other
# alt       beskrivning för skärmläsare och Google (syns inte på sidan)
# title, client, year
#           valfria, visas bara i lightboxen när de är ifyllda
# border    valfritt: border: true ger en tunn ljusgrå linje (1 px, #dedede) runt
#           bilden, i gridet och i lightboxen. För bilder med vit bakgrund.
#           Sätts per bild, också på var och en av bilderna i ett par.
#
# Exempel med valfria fält:
# - file: beaujolais-nouveau-poster-2025.jpg
#   category: graphic-design
#   alt: Beaujolais Nouveau poster 2025 …
#   title: Beaujolais Nouveau 2025
#   client: Exempelkund
#   year: 2025
#   border: true
#
# Bildpar – två bilder staplade i samma kolumn, t.ex. två liggande foton.
# Parets höjd inklusive mellanrum blir exakt radhöjden, bilderna beskärs
# inte och kolumnens bredd räknas fram ur proportionerna. Båda bilderna
# måste hamna i samma sektion (båda photography, eller båda icke-foton).
# I lightboxen visas paret tillsammans, staplat som i gridet, som ett steg.
#
# Videoklipp (mp4): importera först originalet, som komprimeras och får en
# stillbild:  npm run import-video -- material/gallery/<kategori>/klipp.mp4
# Lägg sedan till en post med video: i stället för file:. Klippet spelas tyst
# i loop i gridet när det syns; i lightboxen med kontroller (och ljud om
# originalet har ljud).
# - video: klipp.mp4
#   category: graphic-design
#   alt: Kort beskrivning av klippet
# - pair:
#     - file: dsc2558.jpg
#       category: photography
#       alt: Black and white gravestone plaque …
#     - file: l1032298.jpg
#       category: photography
#       alt: Vintage Le Moulin Rouge hotel sign …

